version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: iot_fleet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fleet_management
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet_management"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
